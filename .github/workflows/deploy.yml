name: Deploy to Aliyun OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        env:
          NUXT_PUBLIC_ARTALK_SERVER: ${{ secrets.NUXT_PUBLIC_ARTALK_SERVER }}
          NUXT_PUBLIC_ARTALK_SITE: ${{ secrets.NUXT_PUBLIC_ARTALK_SITE }}
        run: pnpm generate

      - name: Install ossutil
        run: |
          sudo -v
          curl https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Configure ossutil
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: oss-${{ secrets.OSS_REGION }}.aliyuncs.com
        run: |
          ossutil config \
            --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET" \
            --endpoint "$OSS_ENDPOINT"

      - name: Upload to OSS
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          ossutil rm "oss://${OSS_BUCKET}/" -r -f || true
          ossutil cp -r .output/public/ "oss://${OSS_BUCKET}/" -f
