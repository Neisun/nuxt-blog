name: Rollback to a Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要回滚到的 release tag（例如 v20261114-153000-abc1234）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rollback
          gh release download "${{ inputs.tag }}" --pattern 'release.zip' --dir /tmp/rollback

      - name: Extract artifact
        run: |
          mkdir -p /tmp/rollback/public
          unzip -q -o /tmp/rollback/release.zip -d /tmp/rollback/public

      - name: Install ossutil
        run: |
          sudo -v
          curl https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Configure ossutil
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: oss-${{ secrets.OSS_REGION }}.aliyuncs.com
        run: |
          ossutil config \
            --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET" \
            --endpoint "$OSS_ENDPOINT"

      - name: Upload to OSS
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          ossutil rm "oss://${OSS_BUCKET}/" -r -f || true
          ossutil cp -r /tmp/rollback/public/ "oss://${OSS_BUCKET}/" -f
